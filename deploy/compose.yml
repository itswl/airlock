# One host running airlock. `scripts/compose_smoke.py` runs this file as it is
# (stub engines, a harmless worker) and checks the flow and the network split;
# with real credentials and models, check each boundary on your host again.
#
# Parameters (environment or an .env next to it):
#   AIRLOCK_ROOT           host directory for data, runs, credentials, work (default /opt/airlock)
#   AIRLOCK_IMAGE, AIRLOCK_LAUNCHER_IMAGE, AIRLOCK_INVESTIGATOR_IMAGE
#   AIRLOCK_CONSOLE_PORT   where the console listens on 127.0.0.1 (default 8080)
#   DOCKER_GID             the group that owns the Docker socket (0 on Docker Desktop / OrbStack)
#   AIRLOCK_EGRESS_ALLOW   the hosts investigators may reach through the proxy (the model gateway among them)
#   AIRLOCK_INFRA_MCP_ALLOWED  the MCP tools the infra investigator may call, e.g. mcp__alerts__get_*,mcp__alerts__list_*
#   COMPOSE_PROFILES           which optional pieces start, comma-separated:
#     mcp-gate   the MCP gateway (mcp-gate.json, mcp-gate.env; airlock/mcpgate.py)
#     watch      the watcher, a source (watch.yaml, watch.env, profiles/watch-brief.md; airlock/extras/watch)
#     feishu     the chat adapter, a subscriber (feishu.yaml, feishu.env; airlock/extras/feishu)
#     selfcheck  health, the model and the watcher's clock, alarmed on its own road (selfcheck.yaml, selfcheck.env)
#     mirrors    the repositories investigators read and workers change (mirrors.yaml, mirrors.env)
#   The optional pieces run as uid 10001: create their state directories for that uid.
#
# Six networks, so that who can reach whom is the diagram, not a hope:
#   investigate  control plane <-> investigators, and the watcher -> the intake
#   launch       control plane <-> launcher          (investigators cannot reach the launcher at all)
#   egress       investigators and the watcher -> egress proxy (their only way out)
#   tools        investigators and the watcher -> MCP gateway (only those that use it)
#   edge         the watcher -> the chat adapter's notice door
#   outside      control plane, proxy, MCP gateway, chat adapter, mirrors (webhooks, allowlisted egress, the platforms)
# Worker containers are started by the launcher through the Docker socket, on
# the network each worker profile names; create those networks yourself.

name: airlock

networks:
  investigate: {internal: true}
  launch: {internal: true}
  egress: {internal: true}
  tools: {internal: true}
  edge: {internal: true}
  outside: {}

services:
  control:
    image: ${AIRLOCK_IMAGE:-airlock:0.1}
    command: [python, -m, airlock.control, --config, /etc/airlock/config.yaml, --host, 0.0.0.0, --port, "8080"]
    env_file: control.env              # AIRLOCK_SESSION_SECRET, AIRLOCK_OPERATOR_PASSWORD_HASH, AIRLOCK_LAUNCHER_SECRET, source and investigator secrets
    volumes:
      - ./config.yaml:/etc/airlock/config.yaml:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/data:${AIRLOCK_ROOT:-/opt/airlock}/data
    ports:
      - "127.0.0.1:${AIRLOCK_CONSOLE_PORT:-8080}:8080"   # put TLS and your SSO / VPN in front; this is the approval button
    networks: [investigate, launch, outside]
    restart: unless-stopped

  launcher:
    image: ${AIRLOCK_LAUNCHER_IMAGE:-airlock-launcher:0.1}   # deploy/Dockerfile.launcher: airlock + the Docker CLI
    command: [python, -m, airlock.launcher, --config, /etc/airlock/config.yaml, --host, 0.0.0.0, --port, "8090"]
    env_file: launcher.env             # AIRLOCK_LAUNCHER_SECRET only
    user: "10001:10001"
    group_add: ["${DOCKER_GID:-0}"]    # may use the Docker socket; nothing else here may
    volumes:
      - ./config.yaml:/etc/airlock/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path inside and outside: the Docker daemon resolves the run
      # directory and the credential directories as HOST paths.
      - ${AIRLOCK_ROOT:-/opt/airlock}/runs:${AIRLOCK_ROOT:-/opt/airlock}/runs
      - ${AIRLOCK_ROOT:-/opt/airlock}/data:${AIRLOCK_ROOT:-/opt/airlock}/data
      # The repositories workers with `repos` may change: the launcher clones from
      # here for every run and reads the start of each change back from here.
      - ${AIRLOCK_ROOT:-/opt/airlock}/repos:${AIRLOCK_ROOT:-/opt/airlock}/repos:ro
    networks: [launch]
    restart: unless-stopped

  investigator-infra:
    image: ${AIRLOCK_INVESTIGATOR_IMAGE:-airlock-investigator:0.1}    # FROM airlock:0.1 + 'airlock[claude]' + kubectl + aws CLI
    command: [python, -m, airlock.runner.investigator, --port, "8100"]
    environment:
      AIRLOCK_PROFILE: infra
      AIRLOCK_CONTROL_URL: http://control:8080
      AIRLOCK_WORKDIR: /work
      AIRLOCK_STATE_DIR: /state                                  # sessions and records, out of the agent's sight
      AIRLOCK_INSTRUCTIONS_FILE: /etc/airlock/infra.md
      AIRLOCK_POSTURE_FILE: /etc/airlock/posture-infra.yaml
      AIRLOCK_MCP_CONFIG: /etc/airlock/mcp-infra.json            # read-only credentials, or a server behind mcp-gate
      AIRLOCK_MCP_ALLOWED: ${AIRLOCK_INFRA_MCP_ALLOWED:-}
      AIRLOCK_SKILLS: all
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: control,mcp-gate
      KUBECONFIG: /creds/kubeconfig
      AWS_SHARED_CREDENTIALS_FILE: /creds/aws-credentials
    env_file: investigator-infra.env   # AIRLOCK_SECRET (= AIRLOCK_INVESTIGATOR_INFRA_SECRET), the model API key
    volumes:
      - ./profiles/infra.md:/etc/airlock/infra.md:ro
      - ./profiles/posture-infra.yaml:/etc/airlock/posture-infra.yaml:ro
      - ./profiles/mcp-infra.json:/etc/airlock/mcp-infra.json:ro
      - ./profiles/skills-infra:/work/.claude/skills:ro          # SKILL.md files, one directory per skill
      - ${AIRLOCK_ROOT:-/opt/airlock}/creds/investigator-infra:/creds:ro   # READ-ONLY identities only
      - ${AIRLOCK_ROOT:-/opt/airlock}/work/infra:/work
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/infra:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [investigate, egress, tools]
    restart: unless-stopped

  investigator-code:
    image: ${AIRLOCK_INVESTIGATOR_IMAGE:-airlock-investigator:0.1}
    command: [python, -m, airlock.runner.investigator, --port, "8100"]
    environment:
      AIRLOCK_PROFILE: code
      AIRLOCK_CONTROL_URL: http://control:8080
      AIRLOCK_WORKDIR: /work
      AIRLOCK_STATE_DIR: /state
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: control
    env_file: investigator-code.env
    volumes:
      - ${AIRLOCK_ROOT:-/opt/airlock}/repos:/work/code:ro   # the mirrors it reads (the mirrors service); the :ro is the boundary
      - ${AIRLOCK_ROOT:-/opt/airlock}/work/code:/work
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/code:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [investigate, egress]
    restart: unless-stopped

  # MCP servers whose credential can also write. The gateway holds the credential and
  # forwards only the tools mcp-gate.json names; an investigator gets a token that
  # is good only here. Its record of every call is data/mcp-gate/calls.jsonl.
  mcp-gate:
    image: ${AIRLOCK_IMAGE:-airlock:0.1}
    profiles: [mcp-gate]
    command: [python, -m, airlock.mcpgate, --config, /etc/airlock/mcp-gate.json, --host, 0.0.0.0, --port, "8097",
              --record, /records/calls.jsonl]
    env_file:
      - path: mcp-gate.env             # the servers' credentials, one token per investigator that uses it
        required: false                # unset, the gateway names the missing variable and stops
    volumes:
      - ./mcp-gate.json:/etc/airlock/mcp-gate.json:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/data/mcp-gate:/records
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts: ["host.docker.internal:host-gateway"]   # for a server that runs on the host, like a desktop chat app's
    networks: [tools, outside]
    restart: unless-stopped

  # ---------------------------------------------------------------- around the core (airlock/extras)
  # Each is a source or a subscriber: it talks to the core only through its doors.

  # A source. Scans the chat (through mcp-gate) and Jira on a schedule; a model with no
  # tools of its own judges; this process signs: tasks to the intake, notes to the adapter.
  watch:
    image: ${AIRLOCK_INVESTIGATOR_IMAGE:-airlock-investigator:0.1}   # the SDK, for the judge
    profiles: [watch]
    command: [python, -m, airlock.extras.watch, --config, /etc/airlock/watch.yaml]
    env_file:
      - path: watch.env                # model settings; AIRLOCK_WATCH_* secrets and the names that are yours
        required: false
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: control,mcp-gate,feishu
    volumes:
      - ./watch.yaml:/etc/airlock/watch.yaml:ro
      - ./profiles/watch-brief.md:/etc/airlock/watch-brief.md:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/watch:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [investigate, egress, tools, edge]
    restart: unless-stopped

  # A subscriber and an adapter: the outlet's notifications as cards, replies back as your
  # messages. It dials out to the platform; nothing inbound needs a public route.
  feishu:
    image: ${AIRLOCK_FEISHU_IMAGE:-airlock-feishu:0.1}   # deploy/Dockerfile.feishu
    profiles: [feishu]
    command: [python, -m, airlock.extras.feishu, --config, /etc/airlock/feishu.yaml, --host, 0.0.0.0, --port, "9100"]
    env_file:
      - path: feishu.env               # the application's id and secret, the doors' secrets, the chats, the people
        required: false
    volumes:
      - ./feishu.yaml:/etc/airlock/feishu.yaml:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/feishu:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [outside, edge]
    restart: unless-stopped

  # The road around everything else: health endpoints, one-token model calls, the watcher's
  # clock. Alarms through its own custom bot webhook, never through the adapter above.
  selfcheck:
    image: ${AIRLOCK_IMAGE:-airlock:0.1}
    profiles: [selfcheck]
    command: [python, -m, airlock.extras.selfcheck, --config, /etc/airlock/selfcheck.yaml]
    env_file:
      - path: selfcheck.env            # the alarm webhook; the model settings the model check uses
        required: false
    volumes:
      - ./selfcheck.yaml:/etc/airlock/selfcheck.yaml:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/watch:/watch:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/state/selfcheck:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [investigate, launch, tools, edge, outside]
    restart: unless-stopped

  # Fresh mirrors of the repositories: the code investigator reads them (read-only), and
  # workers with `repos` clone them for every run. A read-only token, never on a command line.
  mirrors:
    image: ${AIRLOCK_INVESTIGATOR_IMAGE:-airlock-investigator:0.1}   # has git
    profiles: [mirrors]
    command: [python, -m, airlock.extras.mirrors, --config, /etc/airlock/mirrors.yaml]
    env_file:
      - path: mirrors.env              # AIRLOCK_MIRRORS_TOKEN
        required: false
    volumes:
      - ./mirrors.yaml:/etc/airlock/mirrors.yaml:ro
      - ${AIRLOCK_ROOT:-/opt/airlock}/repos:/repos
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [outside]
    restart: unless-stopped

  egress:
    image: ${AIRLOCK_IMAGE:-airlock:0.1}
    command: [python, -m, airlock.egress.proxy]
    environment:
      EGRESS_ALLOW: ${AIRLOCK_EGRESS_ALLOW:-api.anthropic.com,.amazonaws.com,api.github.com,github.com}
      EGRESS_PORTS: "443"
    networks: [egress, outside]
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped
